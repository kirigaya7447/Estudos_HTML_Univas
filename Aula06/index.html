<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explore Mais - Viagens e Destino</title>
  </head>

  <body>
    <header>
      <a href="#">
        <img src="logo.png" alt="logo Explore Mais" width="50" height="50" />
      </a>
      <p>Descubra o mundo passo a passo</p>
      <label for="busca">Buscar:</label>
      <input type="text" id="busca" placeholder="Buscar..." />
      <nav>
        <a href="#">Entrar</a>
        <button>Cadastra-se</button>
      </nav>
    </header>
    <nav>
      <a href="#destino">Destinos</a>
      <a href="#dicas">Dicas de viagem</a>
      <a href="#sobre">Sobre nós</a>
      <a href="#contato">Contato</a>
    </nav>
    <main id="conteudo-principal">
      <arcticle id="destino-principal">
        <img
          src="paradise.jpg"
          alt="Banner de Viagem"
          width="100%"
          height="350"
        />
        <h1>Grandes destinos</h1>
        <p>Conheça os principais pontos turísticos do mundo</p>
        <button>Conheça nossos destinos</button>
      </arcticle>
      <section id="destaques">
        <h2>Destaques</h2>
      </section>
      <section id="explore-mais">
        <h2>Explore mais</h2>
      </section>
    </main>
  </body>
</html>
